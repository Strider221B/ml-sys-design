name: CI Quality Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'p[0-9]+'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-ci:
    name: TypeScript & Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Vitest with coverage (>= 90%)
        run: npm run test:cov

      - name: Validate TypeScript coding standards (AST)
        run: npm run validate:ts

      - name: Verify Next.js production standalone build
        run: npm run build

  python-ci:
    name: Python Scientific & Worker CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run mypy type check (strict)
        run: mypy scripts tests

      - name: Run pytest with branch coverage (>= 90%)
        run: pytest

      - name: Validate Python coding standards (AST)
        run: python scripts/standards_validator.py

  ci-status:
    name: CI Status Gate
    needs: [typescript-ci, python-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify pipeline success
        run: |
          if [ "${{ needs.typescript-ci.result }}" != "success" ] || [ "${{ needs.python-ci.result }}" != "success" ]; then
            echo "❌ CI Quality Pipeline failed!"
            exit 1
          fi
          echo "✅ All CI checks passed successfully!"
